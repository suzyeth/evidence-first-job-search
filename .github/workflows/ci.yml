name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov
      - name: Compile scripts
        run: python -m py_compile scripts/sweep.py scripts/boardsweep.py scripts/sponsor_check.py scripts/fact_check.py
      - name: Validate example configs are valid JSON
        run: python -c "import json,glob; [json.load(open(p, encoding='utf-8')) for p in glob.glob('scripts/*.json')]"
      - name: Run tests (offline)
        run: python -m pytest tests -q --cov=scripts --cov-report=term --cov-fail-under=80
